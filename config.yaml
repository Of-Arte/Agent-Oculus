# Agent Oculus profile config — app-specific defaults only.
# Model/provider selection is NOT hardcoded here; users choose via
# `hermes model` or `oculus model` at install time.

# Terminal working directory — anchors the agent to this profile's workspace.
terminal:
  cwd: ~/.hermes/profiles/oculus

# Enable the oculus plugin toolpack.
plugins:
  enabled:
    - oculus
  disabled: []

# Disable all non-essential skills. The oculus agent runs a lightweight LLM
# that cannot use software-engineering tools. Only doctrine + web + terminal
# are needed for finance context synthesis.
skills:
  disabled:
    # Software engineering (not needed — lightweight LLM)
    - claude-code
    - codex
    - opencode
    - simplify-code
    - test-driven-development
    - systematic-debugging
    - node-inspect-debugger
    - python-debugpy
    - code-review
    - dogfood
    - requesting-code-review
    - spike
    - subagent-driven-development
    - writing-plans
    - plan
    # Creative / media (not needed)
    - architecture-diagram
    - ascii-art
    - ascii-video
    - baoyu-comic
    - baoyu-infographic
    - claude-design
    - comfyui
    - design-md
    - excalidraw
    - p5js
    - pixel-art
    - popular-web-designs
    - pretext
    - sketch
    - songwriting-and-ai-music
    - touchdesigner-mcp
    # Data science / ML (not needed)
    - jupyter-live-kernel
    - huggingface-hub
    - evaluating-llms-harness
    - weights-and-biases
    - llama-cpp
    - serving-llms-vllm
    - gguf-quantization
    - outlines
    - guidance
    - dspy
    - axolotl
    - fine-tuning-with-trl
    - grpo-rl-training
    - peft-fine-tuning
    - pytorch-fsdp
    - unsloth
    - audiocraft-audio-generation
    - clip
    - segment-anything-model
    - stable-diffusion-image-generation
    - whisper
    # Gaming (not needed)
    - minecraft-modpack-server
    - pokemon-player
    # DevOps / infra (not needed)
    - webhook-subscriptions
    # Note-taking / productivity (not needed)
    - obsidian
    - notion
    - airtable
    - box
    - google-workspace
    - powerpoint
    - xlsx
    - docx
    - pdf
    - nano-pdf
    - ocr-and-documents
    - meeting-action-items
    - weekly-review-planning
    - document-to-action-items
    - session-librarian
    # Smart home (not needed)
    - openhue
    # Social media (not needed)
    - xitter
    - xurl
    - spotify
    # Research (not needed — web search is enabled below)
    - arxiv
    - blogwatcher
    - competitor-news-monitor
    - grounded-citations
    - llm-wiki
    - ml-paper-writing
    - polymarket
    # DevOps / code quality
    - autonomous-ai-agents
    # Other
    - creative
    - devops
    - email-inbox-triage
    - himalaya
    - maps
    - product-price-monitor

# App-specific settings
public:
  base_url: https://api.public.com
  timeout_seconds: 15
  retry:
    max_attempts: 4
    base_delay_seconds: 0.5
    max_delay_seconds: 8.0
    jitter_seconds: 0.25
  auth:
    token_endpoint: /userapiauthservice/personal/access-tokens
    token_validity_minutes: 480
  routes:
    account: /userapigateway/trading/account
    positions: /userapigateway/trading/positions
    orders: /userapigateway/trading/orders
    quotes: /userapigateway/marketdata/{account_id}/quotes
    expirations: /userapigateway/options/expirations
    chain: /userapigateway/options/chain

worldmonitor:
  timeout_seconds: 15

features:
  read_only: true
  execution_enabled: false

schedule:
  context_signals_interval_minutes: 15

thresholds:
  etf_flow_reversal_threshold: 100000000

# Web search enabled for market research; all other toolsets default-on.
web:
  backend: keenable
  provider_tier:
    keenable: free
